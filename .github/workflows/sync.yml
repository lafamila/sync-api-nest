name: Sync Server And Contracts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sync_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d sync_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8.2-alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:turn-config
      - run: npm run test:integration
      - run: npm run build

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci
      - run: npm ci --prefix web
      - run: npm exec --prefix web -- playwright install --with-deps chrome
      - run: npm run build:all
      - run: npm run test:browser --prefix web

  shared-contracts:
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - name: Require explicit read-only sibling repository access
        env:
          READ_TOKEN: ${{ secrets.SYNC_WORKSPACE_READ_TOKEN }}
        run: |
          if [[ -z "$READ_TOKEN" ]]; then
            printf '%s\n' 'Configure SYNC_WORKSPACE_READ_TOKEN with read-only access to the three Sync native repositories.' >&2
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          path: sync-api-nest
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/sync-app-swift
          ref: ${{ vars.SYNC_SWIFT_REF || 'main' }}
          path: sync-app-swift
          token: ${{ secrets.SYNC_WORKSPACE_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/sync-app-android
          ref: ${{ vars.SYNC_ANDROID_REF || 'main' }}
          path: sync-app-android
          token: ${{ secrets.SYNC_WORKSPACE_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/sync-app-windows
          ref: ${{ vars.SYNC_WINDOWS_REF || 'main' }}
          path: sync-app-windows
          token: ${{ secrets.SYNC_WORKSPACE_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sync-api-nest/package-lock.json
      - run: npm ci
        working-directory: sync-api-nest
      - run: npm run contracts:check
        working-directory: sync-api-nest
      - run: npm run test:contracts
        working-directory: sync-api-nest
